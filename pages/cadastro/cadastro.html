<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../cadastro/css/cadastro.css" />
    <title>Criar conta | Brasil GO</title>
  </head>
  <body>
    <header class="logo">
      <img src="../../assets/images/Logo.png" alt="Brasil GO" />
    </header>
    <div class="container-cadastro">
      <div class="cadastro">
        <h1 class="bemvindo">Bem-vindo á sua próxima viagem!</h1>
        <form class="form" id="form-cadastro" method="post">
          <div class="input-login">
            <label class="label" for="informe"
              >Informe um email, CPF ou número de telefone</label
            >
            <input type="text" id="informe" name="identificador" autocomplete="username" required />
          </div>
          <div class="input-login">
            <label class="label" for="senha">Crie uma senha</label>
            <input type="password" id="senha" name="senha" autocomplete="new-password" minlength="8" required />
          </div>
          <div class="botoes">
            <button class="botao" type="submit">Criar conta</button>
            <a class="botaodois" href="../login/login.html">Voltar ao Login</a>
          </div>
        </form>
      </div>
    </div>
    <script src="./js/cadastro.js"></script>
  </body>
</html>
