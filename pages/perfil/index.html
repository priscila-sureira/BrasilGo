<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/perfil.css">
    <title>Meu perfil | Brasil GO</title>
</head>
<body>
  <div class="background"></div>


    <div class="fundo-usuario">
    <header class="minhas-viagens">
        <nav><a href="../../pages/minhasviagens/index.html">Minhas Viagens</a></nav>
    </header>
      </div>
   
    <div class="back">
    <div class="Perfil-Usuario">
        <img src="../../assets/images/Ellipse-20.svg" alt="Foto do Usuário" class="img-user">
        <h1 class="titulo">Olá, (nome do usuário)</h1>
    </div>
    </div>
  
    <form class="form-cadastro" id="form-perfil" method="post">
        <h2 class="titulo-dados">Dados Cadastrais</h2>
        <div class="form-container">
            <div class="coluna-esquerda">
            <input type="text" id="nome" name="nome" placeholder="Nome Completo" aria-label="Nome completo" autocomplete="name" required>

            <input type="text" id="nascimento" name="nascimento" placeholder="Data de nascimento" aria-label="Data de nascimento" inputmode="numeric" autocomplete="bday" required> 

            <input type="email" id="email" name="email" placeholder="Email" aria-label="E-mail" autocomplete="email" required>
            </div>

            <div class="coluna-direita">
            <input type="text" id="cpf" name="cpf" placeholder="CPF" aria-label="CPF" inputmode="numeric" autocomplete="off" required>

            <input type="tel" id="telefone" name="telefone" placeholder="Telefone" aria-label="Telefone" autocomplete="tel" required>

            <input type="password" id="senha" name="senha" placeholder="Senha" aria-label="Senha" autocomplete="new-password" required>
        </div>
        
        <div class="caixa-botão">
        <button class="bnt-salvar" type="submit">Salvar as Alterações</button>
        <p id="perfil-status" role="status"></p>
        </div>
        
        </div>
    </form>

    <script src="./js/perfil.js"></script>
</body>
</html>
